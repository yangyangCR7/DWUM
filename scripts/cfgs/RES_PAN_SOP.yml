MODEL:
  BACKBONE: 'Resnet50'          
  EMBEDDING_SIZE: 128            

LOSS:
# 'MS', 'NCA', 'SoftTriple', 'Proxy_Anchor'
  METRIC_LOSS: 'Proxy_Anchor'
  
  SOFT_TRIPLE_LA: 20.0
  SOFT_TRIPLE_GAMMA: 0.1
  SOFT_TRIPLE_TAU: 0.2
  SOFT_TRIPLE_MARGIN: 0.01
  SOFT_TRIPLE_K: 2            
  
  PROXY_LR: 500
  BETA: 1e-5
  NOISE_RATE: 0.5
  WARMUP_EPOCHS: 2
  GAMMA: 0.3
  LAMBDA_DIM: 0.1
  LAMBDA_DCL: 0.5
  LAMBDA_VAR: 1.0
  TAU_DCL: 0.07

SOLVER:
  BASE_LR: 0.0001                
  METRIC_GAMMA: 0.5
  METRIC_STEPS: 5
  WEIGHT_DECAY: 0.0005           
  WARM_UP_EPOCH: 2
  BN_FREEZE: True
  MAX_GRAD_NORM: 5.0 
  
DATA_LOADER:
  NUM_THREADS: 8

TRAIN:
  DATASET: ./Dataset/SOP/Symmetric/0.5_Symmetric
  MODEL_PATH: ./saved_models/models/
  BOARD_LOG_PATH: ./saved_models/tensorboard
  NUM_PER_CLASS: 2               
  NUM_SAMPLED_CLASSES: 60        
  EPOCHES: 50
  SEED: 2024

TEST:
  DATASET: ./Dataset/SOP/Symmetric/0.5_Symmetric
  EVAL_ITER: 5                   